<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found — Oceanside Appliance</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Jost', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(165deg, #eaf5ff, #fff); color: #1a2e44; padding: 2rem; text-align: center; }
    .code { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(6rem, 20vw, 9rem); font-weight: 700; color: #1a7fc1; opacity: .18; line-height: 1; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2.2rem; margin: .25rem 0 .75rem; }
    p { color: #6f849a; margin-bottom: 2rem; }
    .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
    a { display: inline-flex; padding: .85rem 1.6rem; border-radius: 12px; font-weight: 600; text-decoration: none; }
    .primary { background: #1a7fc1; color: #fff; }
    .outline { border: 1.5px solid #cfe4f5; color: #1a7fc1; background: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <div class="actions">
      <a class="primary" id="homeLink" href="/">Back to the store</a>
      <a class="outline" href="tel:+17607548200">Call (760) 754-8200</a>
    </div>
  </main>
  <script>
    // Works both on GitHub Pages (/oceanside-appliance/) and on a custom domain (/)
    var base = location.pathname.indexOf('/oceanside-appliance') === 0 ? '/oceanside-appliance/' : '/';
    document.getElementById('homeLink').href = base;
  </script>
</body>
</html>
