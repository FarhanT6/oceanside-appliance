<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found — Oceanside Appliance</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Jost', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #faf9f6; color: #17191c; padding: 2rem; text-align: center; -webkit-font-smoothing: antialiased; }
    .code { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: #6a7077; margin-bottom: 1rem; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: clamp(2.6rem, 7vw, 4rem); line-height: 1.05; margin-bottom: 1rem; }
    h1 em { color: #1f5068; }
    p { color: #464b52; margin-bottom: 2.25rem; }
    .actions { display: flex; gap: 1.5rem; justify-content: center; align-items: center; flex-wrap: wrap; }
    a { text-decoration: none; font-size: .92rem; font-weight: 500; color: #17191c; }
    .primary { padding: .85rem 1.6rem; border-radius: 99px; background: #17191c; color: #faf9f6; }
    .primary:hover { background: #1f5068; }
    .outline { border-bottom: 1px solid #d6d1c8; padding-bottom: .15rem; }
    .outline:hover { border-color: #17191c; }
  </style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>This page has <em>moved.</em></h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <div class="actions">
      <a class="primary" id="homeLink" href="/">Back to the store</a>
      <a class="outline" href="tel:+17607548200">Call (760) 754-8200</a>
    </div>
  </main>
  <script>
    // Works both on GitHub Pages (/oceanside-appliance/) and on a custom domain (/)
    var base = location.pathname.indexOf('/oceanside-appliance') === 0 ? '/oceanside-appliance/' : '/';
    document.getElementById('homeLink').href = base;
  </script>
</body>
</html>
